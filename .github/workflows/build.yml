name: Build FreeBuild

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FreeBuild.csproj

      - name: Build
        run: dotnet build FreeBuild.csproj --configuration Release --no-restore

      - name: Upload FreeBuild.dll
        uses: actions/upload-artifact@v4
        with:
          name: FreeBuild-DLL
          path: bin/Release/net48/FreeBuild.dll
